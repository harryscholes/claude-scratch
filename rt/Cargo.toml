[package]
name = "rt"
version = "0.1.0"
edition = "2024"
description = "A ripgrep-like CLI tool using Tantivy for full-text search"
license = "MIT"

[[bin]]
name = "rt"
path = "src/main.rs"

[dependencies]
tantivy = "0.22"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
colored = "2"
tempfile = "3"
rayon = "1"
crossbeam-channel = "0.5"
memmap2 = "0.9"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
