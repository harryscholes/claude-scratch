[package]
name = "rabitq"
version = "0.1.0"
edition = "2021"
authors = ["Claude"]
description = "RaBitQ: Quantizing High-Dimensional Vectors with a Theoretical Error Bound for Approximate Nearest Neighbor Search"
license = "MIT"
repository = "https://github.com/harryscholes/claude-scratch"
keywords = ["vector", "quantization", "nearest-neighbor", "similarity-search", "ann"]
categories = ["algorithms", "science"]

[features]
default = []
bench-hdf5 = ["dep:hdf5", "dep:ndarray", "dep:shellexpand"]

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
hdf5 = { version = "0.8", optional = true }
ndarray = { version = "0.15", optional = true }
shellexpand = { version = "3.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"

[[bench]]
name = "rabitq_bench"
harness = false

[[bench]]
name = "sift_bench"
harness = false
required-features = ["bench-hdf5"]

[lib]
name = "rabitq"
path = "src/lib.rs"
